version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env.local
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../chainlit_app.py:/app/chainlit_app.py
    depends_on:
      - redis
      - mongo
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017

  chainlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env.local
    ports:
      - "8080:8080"
    volumes:
      - ../src:/app/src
      - ../chainlit_app.py:/app/chainlit_app.py
    depends_on:
      - redis
      - mongo
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017
    command: ["chainlit", "run", "chainlit_app.py", "--host", "0.0.0.0", "--port", "8080"]

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  ollama_data:
  mongo_data:
